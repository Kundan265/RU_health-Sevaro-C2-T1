name: Verify submission

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - name: Install verified dependencies
        run: python -m pip install -r dashboard/requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Verify replay, models and workflow
        run: python dashboard/verify_hackathon.py --output /tmp/sevaro-verification
